site_name: TripSit Infrastructure Documentation
site_url: https://docs.tripsit.me
site_description: Documentation for TripSit live server infrastructure, Docker services, security, and administration.
site_author: TripSit Systems Team

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Getting Started:
      - Architecture Overview: getting-started/overview.md
      - Host Deployment Guide: getting-started/deployment.md
  - Core Infrastructure:
      - Reverse Proxy & DNS (Traefik): core-infrastructure/traefik.md
      - Security & Access Control: core-infrastructure/security.md
      - Management & CI/CD: core-infrastructure/management.md
  - Services:
      - Chat & Bridges: services/chat-and-bridges.md
      - Bots & Main Website: services/bots-and-web.md
      - Wikis & Education: services/wikis-and-education.md
      - Monitoring & Utilities: services/monitoring-and-utilities.md
  - Operations & Maintenance:
      - Directory Layout & Volumes: operations/directory-structure.md
      - Maintenance & Troubleshooting: operations/maintenance-and-troubleshooting.md
